name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Android-Workload installieren
        run: dotnet workload install android

      - name: Unit-Tests (Logik ohne Android)
        run: dotnet test tests/ZBoard.Core.Tests --logger "console;verbosity=normal"

      # Debug-Builds legen die .NET-Assemblies sonst nicht in die APK (nur für Deploy aus der IDE gedacht);
      # mit EmbedAssembliesIntoApk lässt sich die APK direkt installieren.
      - name: App bauen (Debug-APK)
        run: dotnet build ZBoard.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

      - name: APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-debug-apk
          path: bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: zboard-debug-apk
          path: apk

      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tastatur im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35  # Android 15: Tastaturfenster reicht bis unter die Navigationsleiste
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/emulator_test.py "$(ls apk/*.apk | head -n 1)" emulator-test

      - name: Screenshots und Log bereitstellen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-test
          path: emulator-test/
          if-no-files-found: warn

  # Neueste getestete Version unter einer festen Adresse:
  # https://github.com/World-of-Bytes/zBoard/releases/download/testversion/zboard-test.apk
  testversion:
    needs: [build, emulator-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: zboard-debug-apk
          path: apk

      - name: Testversion veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp "$(ls apk/*.apk | head -n 1)" zboard-test.apk
          gh release delete testversion --repo "$REPO" --yes --cleanup-tag || true
          gh release create testversion zboard-test.apk --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "Testversion (neuester Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}, Emulator-Test bestanden. Debug-Version zum Ausprobieren (ohne AOT, daher etwas langsamer beim Start als die spätere Release-Version)."
