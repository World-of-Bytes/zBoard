name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Android-Workload installieren
        run: dotnet workload install android

      - name: Unit-Tests (Logik ohne Android)
        run: dotnet test tests/ZBoard.Core.Tests --logger "console;verbosity=normal"

      - name: App bauen (Debug-APK)
        run: dotnet build ZBoard.csproj -c Debug -f net10.0-android

      - name: APK bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: zboard-debug-apk
          path: bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: warn
